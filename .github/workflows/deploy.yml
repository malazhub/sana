name: Sync and Deploy Flutter Web
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync Source from Server
        run: |
          curl -sL https://ais-pre-i4nl26fuzgg5ywi56augro-790065884957.europe-west2.run.app/api/source/archive.tar.gz | tar -xz
          git config user.name 'GitHub Action'
          git config user.email 'action@github.com'
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m 'Automated sync from live server' && git push)

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Build Flutter Web
        run: |
          flutter pub get
          flutter build web --release

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
